<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Личный кабинет налогоплательщика</title>
        <link rel="stylesheet" href="css/style.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="dashboard-page">
        <header class="header">
            <div class="logo-container">
                <div class="logo-circle"></div>
                <h1>Личный кабинет <span>Налогоплательщика</span></h1>
            </div>
            <div class="profile-container"></div>
                <span class="user-name" id="userName">Загрузка...</span>
                <div class="avatar" id="userAvatar">--</div>
                <button id="logoutBtn" style="margin-left: 15px; padding: 5px 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f8f9fa;">Выйти</button>
            </div>
        </header>

        <main class="container">
            <section class="summary-card">
                <div class="summary-text">
                    <p class="label">Начислено налогов</p>
                    <h2 class="amount" id="totalDebt">0 Руб.</h2>
                    <p class="date-info">Срок уплаты до 1 декабря 2026 г.</p>
                </div>
                <button class="btn-pay" id="payButton">Оплатить</button>
            </section>

            <section class="property-section">
                <h3>Мое имущество</h3>
                <div class="property-list" id="propertyContainer"></div>
            </section>

            <section class="history-section">
                <h3>История платежей</h3>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Вид налога</th>
                            <th>Объект</th>
                            <th>Сумма</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="paymentsTableBody"></tbody>
                </table>
            </section>
        </main>
        <script src="js/main.js"></script>
    </body>
</html>
